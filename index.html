<title>26 9모 분석</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #eef1f5;
    --paper-raised: #ffffff;
    --ink: #1d2b4f;
    --ink-soft: #4d5a7a;
    --ink-faint: #8991ab;
    --line: #c7ccd6;
    --line-soft: #dde1e9;
    --accent: #2f7a68;
    --accent-soft: #dcece6;
    --warn: #c1443a;
    --warn-soft: #f6dfdd;
    --bubble-empty: #ffffff;
    --bubble-border: #9aa2b8;
    --shadow: 0 1px 2px rgba(29,43,79,0.06), 0 6px 20px rgba(29,43,79,0.07);
    --focus: #2f5f9e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10141f;
      --paper-raised: #171d2c;
      --ink: #e7e9f2;
      --ink-soft: #aab2c9;
      --ink-faint: #6c7690;
      --line: #333d54;
      --line-soft: #262e42;
      --accent: #63c9ac;
      --accent-soft: #1c332c;
      --warn: #e98177;
      --warn-soft: #3a2422;
      --bubble-empty: #171d2c;
      --bubble-border: #4b5570;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --focus: #7fb0ec;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10141f;
    --paper-raised: #171d2c;
    --ink: #e7e9f2;
    --ink-soft: #aab2c9;
    --ink-faint: #6c7690;
    --line: #333d54;
    --line-soft: #262e42;
    --accent: #63c9ac;
    --accent-soft: #1c332c;
    --warn: #e98177;
    --warn-soft: #3a2422;
    --bubble-empty: #171d2c;
    --bubble-border: #4b5570;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --focus: #7fb0ec;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    padding: 0 20px 64px;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  a { color: inherit; }
  .serif { font-family: "Source Serif 4", Georgia, serif; }
  .mono { font-family: "IBM Plex Mono", "SF Mono", monospace; }

  /* ---------- shell ---------- */
  .shell {
    max-width: 760px;
    margin: 0 auto;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    background:
      radial-gradient(circle at 30% 30%, var(--accent) 0 4px, transparent 4.5px);
    flex: none;
  }
  .brand h1 {
    font-family: "Source Serif 4", serif;
    font-size: 1.28rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .student-chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
  }
  .student-chip:hover { border-color: var(--ink-faint); }
  .student-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .switch-pop {
    position: absolute; right: 0; top: calc(100% + 8px);
    width: 230px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 14px;
    z-index: 10;
  }
  .switch-pop p { margin: 0 0 12px; font-size: 0.82rem; line-height: 1.5; color: var(--ink-soft); }
  .switch-pop-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .switch-pop-actions button { padding: 7px 12px; font-size: 0.8rem; }

  main { padding-top: 28px; }

  /* ---------- name gate ---------- */
  .gate {
    padding-top: 18vh;
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
  }
  .gate .mark-big {
    width: 40px; height: 40px; margin: 0 auto 22px;
    border-radius: 50%; border: 2.5px solid var(--ink);
    background: radial-gradient(circle at 30% 30%, var(--accent) 0 11px, transparent 11.5px);
  }
  .gate h2 { font-family: "Source Serif 4", serif; font-size: 1.5rem; margin: 0 0 6px; text-wrap: balance; }
  .gate p { color: var(--ink-soft); margin: 0 0 26px; font-size: 0.94rem; line-height: 1.5; }
  .gate input {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.98rem;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    text-align: center;
  }
  .gate input:focus { outline: 2px solid var(--focus); outline-offset: 2px; border-color: transparent; }
  .gate button.primary { margin-top: 14px; width: 100%; }
  .gate button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .grade-pick { display: flex; gap: 10px; margin-top: 12px; }
  .grade-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.92rem;
    font-weight: 600;
  }
  .grade-btn:hover { border-color: var(--ink-faint); }
  .grade-btn.picked { border-color: var(--ink); background: var(--ink); color: var(--paper); }

  button { font-family: inherit; cursor: pointer; }
  button.primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  button.primary:hover { opacity: 0.88; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.88rem;
    font-weight: 500;
  }
  button.ghost:hover { border-color: var(--ink-faint); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- topic list (home) ---------- */
  .sheet-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 14px;
  }
  .topic-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 18px;
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .topic-row:hover { border-color: var(--ink-faint); }
  .topic-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-faint);
    width: 22px;
    flex: none;
  }
  .topic-info { flex: 1; min-width: 0; }
  .topic-info h3 {
    margin: 0 0 3px;
    font-family: "Source Serif 4", serif;
    font-size: 1.06rem;
    font-weight: 600;
  }
  .topic-info p { margin: 0; font-size: 0.82rem; color: var(--ink-soft); }
  .omr-row {
    display: flex;
    gap: 5px;
    flex: none;
  }
  .bubble {
    width: 17px; height: 17px;
    border-radius: 50%;
    border: 1.5px solid var(--bubble-border);
    background: var(--bubble-empty);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .bubble.filled { background: var(--ink); border-color: var(--ink); }
  .bubble.filled::after { content: ""; }
  .bubble.wrong { background: var(--warn); border-color: var(--warn); }
  .bubble.sm { width: 12px; height: 12px; }

  /* ---------- hub / rounds ---------- */
  .hub-head { margin-bottom: 20px; }
  .hub-head h2 { font-family: "Source Serif 4", serif; font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
  .hub-head p { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 14px; line-height: 1.5; }
  .hub-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .round-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 18px;
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .round-row:hover { border-color: var(--ink-faint); }
  .round-row .rnum {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    color: var(--paper);
    background: var(--ink);
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .round-row .rinfo { flex: 1; min-width: 0; }
  .round-row .rinfo h4 { margin: 0 0 3px; font-family: "Source Serif 4", serif; font-size: 1rem; font-weight: 600; }
  .round-row .rinfo p { margin: 0; font-size: 0.78rem; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
  .review-cta {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap;
    padding: 16px 18px;
    border: 1.5px dashed var(--warn);
    background: var(--warn-soft);
    border-radius: 12px;
    margin: 18px 0 4px;
  }
  .review-cta p { margin: 0; font-size: 0.85rem; line-height: 1.5; flex: 1 1 200px; }
  .review-cta strong { display: block; font-family: "Source Serif 4", serif; font-size: 1rem; margin-bottom: 2px; }
  .review-cta button { white-space: nowrap; flex: none; }
  .review-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  .review-row:hover { border-color: var(--warn); }
  .review-row .rtag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    color: var(--warn);
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    border-radius: 999px;
    padding: 3px 9px;
    flex: none;
  }
  .review-row .rlabel { font-size: 0.88rem; font-weight: 500; }
  .empty-note { color: var(--ink-faint); font-size: 0.85rem; padding: 18px 0; }

  /* ---------- exercise nav / progress ---------- */
  .exercise-shell { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none; } }
  .backline {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .backbtn {
    background: none; border: none; color: var(--ink-soft);
    font-size: 0.85rem; padding: 4px 0; display: flex; align-items: center; gap: 6px;
  }
  .backbtn:hover { color: var(--ink); }
  .progress-track {
    display: flex; gap: 6px;
  }
  .progress-seg {
    width: 26px; height: 6px; border-radius: 3px; background: var(--line-soft);
  }
  .progress-seg.done { background: var(--accent); }
  .progress-seg.active { background: var(--ink); }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 30px 32px;
  }
  @media (max-width: 520px) { .card { padding: 22px 18px; } }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .card h2 {
    font-family: "Source Serif 4", serif;
    font-size: 1.5rem;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .card .sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 24px; line-height: 1.5; }

  /* ---------- grammar content ---------- */
  .bg-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0 0 22px;
  }
  .bg-block {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .bg-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }
  .bg-text {
    font-family: "Work Sans", sans-serif;
    font-size: 0.9rem;
    line-height: 1.65;
    color: var(--ink);
    margin: 0;
  }
  .grammar-chunk {
    padding: 18px 0;
    border-top: 1px solid var(--line-soft);
  }
  .grammar-chunk:first-of-type { border-top: none; padding-top: 0; }
  .grammar-chunk h4 {
    margin: 0 0 8px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .grammar-chunk p, .grammar-chunk li {
    font-family: "Source Serif 4", serif;
    font-size: 1.02rem;
    line-height: 1.68;
    color: var(--ink);
    max-width: 62ch;
    margin: 0 0 10px;
  }
  .ex-box {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 10px 16px;
    margin: 10px 0;
    font-family: "Source Serif 4", serif;
    font-size: 0.98rem;
    line-height: 1.6;
  }
  .ex-box .rel { color: var(--accent); font-weight: 600; }
  .chunk-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 14px 0 6px;
  }
  .chunk-block {
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    margin: 0 0 10px;
  }
  .chunk-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    padding: 8px 14px;
    border-top: 1px solid var(--line-soft);
  }
  .chunk-row:first-child { border-top: none; }
  .chunk-row .chunk-en {
    font-family: "Source Serif 4", serif;
    font-size: 0.95rem;
    color: var(--ink);
    flex: 1 1 280px;
  }
  .chunk-row .chunk-kr {
    font-family: "Work Sans", sans-serif;
    font-size: 0.86rem;
    color: var(--ink-soft);
    flex: 1 1 200px;
  }

  /* ---------- passage ---------- */
  .passage {
    font-family: "Source Serif 4", serif;
    font-size: 1.05rem;
    line-height: 1.75;
    max-width: 62ch;
  }
  .passage p { margin: 0 0 14px; }
  .given-tag {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .given-block {
    padding: 14px 16px;
    background: var(--line-soft);
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .given-block p { margin: 0; }

  .para-pile { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 22px; }
  .para-card {
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    border-radius: 10px;
    padding: 14px 16px 14px 44px;
    position: relative;
    cursor: grab;
    font-family: "Source Serif 4", serif;
    line-height: 1.6;
    font-size: 0.98rem;
  }
  .para-card:hover { border-color: var(--ink-faint); }
  .para-card.used { opacity: 0.35; cursor: default; pointer-events: none; }
  .para-card .letter {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-faint);
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--bubble-border);
    display: flex; align-items: center; justify-content: center;
  }
  .order-slots { display: flex; gap: 8px; margin: 4px 0 20px; }
  .order-slot {
    flex: 1; height: 44px;
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    color: var(--ink-faint);
  }
  .order-slot { cursor: pointer; }
  .order-slot.filled { border-style: solid; border-color: var(--ink); background: var(--paper-raised); cursor: pointer; }
  .order-slot.filled .letter { font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--ink); }
  .drag-hint { font-size: 0.78rem; color: var(--ink-faint); margin: -10px 0 16px; }

  .insert-marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--bubble-border);
    background: var(--bubble-empty);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    vertical-align: middle;
    margin: 0 3px;
  }
  .insert-marker:hover { border-color: var(--ink); }
  .insert-marker.selected { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .given-sentence {
    font-style: italic;
  }

  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .choice {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    background: var(--paper-raised);
    cursor: pointer;
  }
  .choice:hover { border-color: var(--ink-faint); }
  .choice.selected { border-color: var(--focus); background: var(--accent-soft); }
  .choice.correct { border-color: var(--accent); background: var(--accent-soft); }
  .choice.incorrect { border-color: var(--warn); background: var(--warn-soft); }
  .choice .bub {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--bubble-border);
    flex: none;
  }
  .choice.selected .bub, .choice.correct .bub { background: var(--ink); border-color: var(--ink); }
  .choice.incorrect .bub { background: var(--warn); border-color: var(--warn); }
  .choice span.txt { font-family: "Source Serif 4", serif; font-size: 0.98rem; line-height: 1.5; }

  .word-token {
    cursor: pointer;
    border-bottom: 2px solid transparent;
    border-radius: 3px;
    padding: 0 1px;
  }
  .word-token:hover { background: var(--line-soft); }
  .word-token.picked { background: var(--warn-soft); border-color: var(--warn); }
  .word-token.correct-mark { background: var(--accent-soft); border-color: var(--accent); }
  .word-token.missed-mark { background: var(--warn-soft); border-color: var(--warn); text-decoration: underline wavy var(--warn); }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.55;
    display: none;
  }
  .feedback.show { display: block; animation: rise 0.3s ease both; }
  .feedback.good { background: var(--accent-soft); border: 1px solid var(--accent); }
  .feedback.bad { background: var(--warn-soft); border: 1px solid var(--warn); }
  .feedback strong { display: block; margin-bottom: 4px; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; }

  .actions {
    display: flex; gap: 10px; margin-top: 26px; justify-content: flex-end;
    position: sticky;
    bottom: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    background: var(--paper-raised);
    padding: 12px 0 8px;
    z-index: 5;
  }

  .helper-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin-top: -12px;
    margin-bottom: 18px;
  }

  /* ---------- results ---------- */
  .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0 8px; }
  @media (max-width: 480px) { .results-grid { grid-template-columns: repeat(2, 1fr); } }
  .result-tile {
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
  }
  .result-tile .n { font-family: "IBM Plex Mono", monospace; font-size: 1.5rem; font-weight: 600; }
  .result-tile .l { font-size: 0.72rem; color: var(--ink-soft); margin-top: 2px; }
  .result-tile.ok .n { color: var(--accent); }

  function vocab(q, note, text, words) {

      background: "자기 지각 이론(Self-Perception Theory)은 개인이 자신의 행동을 관찰함으로써 자신의 태도나 성향을 파악한다는 심리학 이론이다. 이 이론에 따르면 사람들은 과거의 선행을 스스로 복기하는 과정에서 자신을 '도덕적인 사람'으로 규정하게 되며, 이러한 도덕적 정체성이 강화될수록 이후에도 그에 부합하는 일관된 행동을 하려는 심리적 기제가 작동한다. 반면, 행동의 결과나 타인의 반응과 같은 외적 보상에 집중할 경우 행위 자체에 대한 내적 동기가 약화되어 오히려 이타적 행동의 지속성이 떨어질 수 있다.",
      structure: "인간의 뇌는 스스로를 선한 사람으로 인식하려는 경향이 있으며, 이는 향후 더 큰 선행을 하도록 동기를 부여한다는 주장으로 시작한다. 한 연구는 과거의 선행을 회상한 개인이 악행에 집중한 개인보다 자선 단체에 거의 두 배 더 많은 금액을 기부한다는 사실을 보여주었다는 근거가 제시된다. 친절에 대한 외부의 반응에 집중하는 것은 순수하게 이타적인 행위 자체에 집중하는 것보다 낮은 관대함으로 이어진다는 추가적인 결과가 부연으로 이어지며, 사회적 체면을 신경 쓰는 사람들보다 선행 그 자체를 위해 행동하는 사람들이 더 큰 관대함을 발휘한다는 결론으로 마무리된다.",
      grammar: GRAMMAR_SP,
      rounds: ROUNDS_SP
    }
  ];

  // All current topics are 고2 (2026 09월 모의고사). Any topic added later
  // without an explicit grade — e.g. 고1 content — falls back to 고2 too,
  // so existing content never needs to be touched when a new grade's topics
  // are added; give each topic its grade in one place instead.
  var GRADES = ["고1", "고2"];
  TOPICS.forEach(function(t){ if (!t.grade) t.grade = "고2"; });

  var DRILL_KEYS = ["order","insertion","title","vocab"];
  var DRILL_LABELS = { order: "Paragraph Order", insertion: "Sentence Insertion", title: "Title Match", vocab: "Vocabulary Check" };
  var DRILL_NEXT = { order: "insertion", insertion: "title", title: "vocab", vocab: "results" };
  var DRILL_EYEBROW = { order: "Paragraph Order", insertion: "Sentence Insertion", title: "Title Match", vocab: "Vocabulary Check" };

  /* ============================================================
     STATE
     progress: { [topicId]: { grammarRead, rounds: { [roundIdx]: { order:{correct}, insertion:{correct}, title:{correct}, vocab:{correct} } } } }
     ============================================================ */
  var state = {
    studentId: null,
    studentName: null,
    studentGrade: null,
    progress: {},
    view: { name: "home" },
    db: null,
  };

  function saveLocal() {
    try {
      localStorage.setItem("bubblesheet_student", JSON.stringify({ id: state.studentId, name: state.studentName, grade: state.studentGrade }));
    } catch (e) {}
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem("bubblesheet_student");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  // Per-student progress, mirrored to localStorage so the app keeps working
  // (and remembers progress across visits on the same device/browser) when
  // it's hosted as a standalone site with no Claude db behind it — window.claude
  // only exists inside a Claude Artifact runtime, so outside of that this
  // localStorage copy is the only persistence there is.
  function progressLocalKey(studentId) { return "bubblesheet_progress_" + studentId; }
  function saveProgressLocal() {
    if (!state.studentId) return;
    try {
      localStorage.setItem(progressLocalKey(state.studentId), JSON.stringify(state.progress));
    } catch (e) {}
  }
  function loadProgressLocal(studentId) {
    try {
      var raw = localStorage.getItem(progressLocalKey(studentId));
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  /* ============================================================
     DB (best-effort; app works fully without it — falls back to
     localStorage when there's no window.claude db, e.g. a standalone
     deployment outside the Claude Artifact runtime)
     ============================================================ */
  async function initDb() {
    try {
      if (window.claude && window.claude.use) {
        state.db = await window.claude.use("db");
      }
    } catch (e) { state.db = null; }
  }

  async function loadProgress() {
    if (!state.studentId) return;
    // Local copy first so progress shows immediately even with no db at all.
    var local = loadProgressLocal(state.studentId);
    if (local) state.progress = local;
    if (!state.db) return;
    try {
      var ref = state.db.doc("students/" + state.studentId);
      var snap = await ref.get();
      if (snap.exists) {
        var d = snap.data();
        state.studentName = d.name || state.studentName;
        state.studentGrade = d.grade || state.studentGrade;
        state.progress = d.progress || state.progress;
      }
    } catch (e) {}
  }

  async function persistProgress() {
    saveProgressLocal();
    if (!state.db || !state.studentId) return;
    try {
      var ref = state.db.doc("students/" + state.studentId);
      await ref.set({ name: state.studentName, grade: state.studentGrade, progress: state.progress, updatedAt: new Date().toISOString() });
    } catch (e) {}
  }

  function ensureTopicProgress(topicId) {
    if (!state.progress[topicId]) state.progress[topicId] = { grammarRead: false, rounds: {} };
    if (!state.progress[topicId].rounds) state.progress[topicId].rounds = {};
    return state.progress[topicId];
  }
  function ensureRoundProgress(topicId, roundIdx) {
    var tp = ensureTopicProgress(topicId);
    if (!tp.rounds[roundIdx]) tp.rounds[roundIdx] = {};
    return tp.rounds[roundIdx];
  }
  function topicProgress(topicId) {
    return state.progress[topicId] || { grammarRead: false, rounds: {} };
  }
  function roundProgress(topicId, roundIdx) {
    var tp = topicProgress(topicId);
    return (tp.rounds && tp.rounds[roundIdx]) || {};
  }
  function markDone(topicId, roundIdx, key, payload) {
    var rp = ensureRoundProgress(topicId, roundIdx);
    rp[key] = Object.assign({ done: true, at: Date.now() }, payload || {});
    persistProgress();
  }
  function markGrammarRead(topicId) {
    ensureTopicProgress(topicId).grammarRead = true;
    persistProgress();
  }

  // All wrong answers across every round of a topic, for the review list.
  function wrongItems(topicId) {
    var topic = getTopic(topicId);
    var tp = topicProgress(topicId);
    var out = [];
    topic.rounds.forEach(function(round, ri){
      var rp = (tp.rounds && tp.rounds[ri]) || {};
      DRILL_KEYS.forEach(function(k){
        if (rp[k] && rp[k].correct === false) out.push({ roundIdx: ri, key: k });
      });
    });
    return out;
  }

  function roundSummary(topicId, roundIdx) {
    var rp = roundProgress(topicId, roundIdx);
    var attempted = 0, correct = 0;
    DRILL_KEYS.forEach(function(k){ if (rp[k] && rp[k].done) { attempted++; if (rp[k].correct) correct++; } });
    return { attempted: attempted, correct: correct, total: DRILL_KEYS.length };
  }

  /* ============================================================
     RENDER HELPERS
     ============================================================ */
  var app = document.getElementById("app");
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function getTopic(id) { return TOPICS.filter(function(t){ return t.id === id; })[0]; }

  function render() {
    clearPendingAutoAdvanceTimers();
    app.innerHTML = "";
    if (!state.studentId) { renderGate(); return; }
    document.getElementById("studentChipLabel").textContent = state.studentName;
    var v = state.view;
    switch (v.name) {
      case "home": renderHome(); break;
      case "gradeSwitch": renderGradeSwitch(); break;
      case "hub": renderHub(v.topicId); break;
      case "grammar": renderGrammar(v.topicId); break;
      case "order": renderOrder(v); break;
      case "insertion": renderInsertion(v); break;
      case "title": renderTitle(v); break;
      case "vocab": renderVocab(v); break;
      case "results": renderResults(v); break;
      case "review": renderReview(v.topicId); break;
    }
  }

  /* ---------- gate ---------- */
  function renderGate() {
    document.getElementById("studentChipLabel").textContent = "enter name";
    var wrap = el("div", "gate");
    wrap.innerHTML =
      '<div class="mark-big" aria-hidden="true"></div>' +
      '<h2>Fill in your name to start</h2>' +
      '<p>Your practice sheet is saved under this name so you can pick up where you left off.</p>' +
      '<input id="nameInput" type="text" placeholder="e.g. 김민준" autocomplete="off" maxlength="24">' +
      '<div id="gradePick" class="grade-pick"></div>' +
      '<button class="primary" id="nameGo" style="margin-top:14px;width:100%;" disabled>Start practice</button>';
    app.appendChild(wrap);

    var pickedGrade = null;
    var gradeWrap = document.getElementById("gradePick");
    GRADES.forEach(function(g){
      var b = el("button", "grade-btn", g);
      b.type = "button";
      b.addEventListener("click", function(){
        pickedGrade = g;
        gradeWrap.querySelectorAll(".grade-btn").forEach(function(o){ o.classList.remove("picked"); });
        b.classList.add("picked");
        goBtn.disabled = !(input.value.trim() && pickedGrade);
      });
      gradeWrap.appendChild(b);
    });

    var input = document.getElementById("nameInput");
    var goBtn = document.getElementById("nameGo");
    input.focus();
    input.addEventListener("input", function(){
      goBtn.disabled = !(input.value.trim() && pickedGrade);
    });
    function go() {
      var v = input.value.trim();
      if (!v || !pickedGrade) { input.focus(); return; }
      state.studentName = v;
      state.studentId = v.toLowerCase().replace(/[^a-z0-9가-힣]/g, "_").slice(0, 40) || ("s" + Date.now());
      state.studentGrade = pickedGrade;
      saveLocal();
      loadProgress().then(render);
    }
    goBtn.addEventListener("click", go);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
  }

  /* ---------- grade switch ---------- */
  function renderGradeSwitch() {
    var wrap = el("div", "gate");
    wrap.innerHTML =
      '<div class="mark-big" aria-hidden="true"></div>' +
      '<h2>Choose your grade</h2>' +
      '<p>' + state.studentName + '님, 볼 학년을 선택하세요.</p>' +
      '<div id="gradePick2" class="grade-pick"></div>';
    app.appendChild(wrap);
    var gradeWrap = document.getElementById("gradePick2");
    GRADES.forEach(function(g){
      var b = el("button", "grade-btn" + (g === state.studentGrade ? " picked" : ""), g);
      b.type = "button";
      b.addEventListener("click", function(){
        state.studentGrade = g;
        saveLocal();
        persistProgress();
        state.view = { name: "home" };
        render();
      });
      gradeWrap.appendChild(b);
    });
  }

  /* ---------- home ---------- */
  function renderHome() {
    var wrap = el("div", "");
    // Students who haven't picked a grade yet (e.g. progress restored from
    // an older save with no grade on it) see everything rather than an
    // empty list.
    var grade = state.studentGrade;
    var topics = grade ? TOPICS.filter(function(t){ return t.grade === grade; }) : TOPICS;

    var labelRow = el("div", "hub-links");
    labelRow.style.cssText = "justify-content:space-between;align-items:center;margin-bottom:14px;";
    var label = el("p", "sheet-label", (grade ? grade + " · " : "") + "TOPICS · " + topics.length + " AVAILABLE");
    label.style.margin = "0";
    labelRow.appendChild(label);
    if (grade) {
      var switchGrade = el("button", "backbtn", "학년 변경");
      switchGrade.style.cssText = "padding:0;";
      switchGrade.addEventListener("click", function(){
        state.view = { name: "gradeSwitch" };
        render();
      });
      labelRow.appendChild(switchGrade);
    }
    wrap.appendChild(labelRow);

    topics.forEach(function(t, i){
      var row = el("button", "topic-row");
      row.type = "button";
      var segs = t.rounds.map(function(_, ri){
        var s = roundSummary(t.id, ri);
        var cls = "progress-seg";
        if (s.attempted === s.total) cls += (s.correct === s.total ? " done" : "");
        return '<span class="' + cls + '" style="' + (s.attempted > 0 && s.correct < s.total && s.attempted === s.total ? 'background:var(--warn);' : '') + (s.attempted > 0 && s.attempted < s.total ? 'background:var(--ink-faint);' : '') + '"></span>';
      }).join("");
      var wrongN = wrongItems(t.id).length;
      row.innerHTML =
        '<span class="topic-num mono">' + String(i+1).padStart(2,"0") + '</span>' +
        '<span class="topic-info"><h3>' + t.title + '</h3><p>' + t.sub + '</p></span>' +
        '<span class="omr-row" title="회차 1·2·3 진행도">' + segs + '</span>' +
        (wrongN ? '<span class="bubble wrong" title="오답 ' + wrongN + '개"></span>' : '');
      row.addEventListener("click", function(){ state.view = { name: "hub", topicId: t.id }; render(); });
      wrap.appendChild(row);
    });
    app.appendChild(wrap);
  }

  function backBtn(label) {
    return el("button", "backbtn", "&larr;&nbsp; " + label);
  }

  /* ---------- hub: grammar + round picker + review ---------- */
  function renderHub(topicId) {
    var topic = getTopic(topicId);
    var wrap = el("div", "exercise-shell");
    var bar = el("div", "backline");
    var b = backBtn("All topics");
    b.addEventListener("click", function(){ state.view = { name: "home" }; render(); });
    bar.appendChild(b);
    wrap.appendChild(bar);

    var head = el("div", "hub-head");
    head.innerHTML = '<p class="eyebrow">' + topic.grammarLabel + '</p><h2>' + topic.title + '</h2><p>' + topic.sub + '</p>';
    var links = el("div", "hub-links");
    var grammarBtn = el("button", "ghost", topicProgress(topicId).grammarRead ? "문법 설명 다시 보기" : "문법 설명 보기 →");
    grammarBtn.addEventListener("click", function(){ state.view = { name: "grammar", topicId: topicId }; render(); });
    links.appendChild(grammarBtn);
    head.appendChild(links);
    wrap.appendChild(head);

    wrap.appendChild(el("p", "sheet-label", "ROUNDS · " + topic.rounds.length + "회차"));
    topic.rounds.forEach(function(round, ri){
      var s = roundSummary(topicId, ri);
      var row = el("button", "round-row");
      row.type = "button";
      var statusText = s.attempted === 0 ? "시작 전" : (s.attempted + "/" + s.total + "문제 · 정답 " + s.correct + "개");
      var bubbles = DRILL_KEYS.map(function(k){
        var rp = roundProgress(topicId, ri);
        var d = rp[k];
        var cls = "bubble sm" + (d ? (d.correct === false ? " wrong" : " filled") : "");
        return '<span class="' + cls + '"></span>';
      }).join("");
      row.innerHTML =
        '<span class="rnum">' + (ri+1) + '회차</span>' +
        '<span class="rinfo"><h4>' + (ri+1) + '회차 문제 세트</h4><p>' + statusText + '</p></span>' +
        '<span class="omr-row">' + bubbles + '</span>';
      row.addEventListener("click", function(){
        state.view = { name: "order", topicId: topicId, roundIdx: ri };
        render();
      });
      wrap.appendChild(row);
    });

    var wrongN = wrongItems(topicId).length;
    var cta = el("div", "review-cta");
    cta.innerHTML =
      '<p><strong>오답만 모아 복습하기</strong>' + (wrongN ? wrongN + '개의 문제를 아직 다시 풀지 않았어요.' : '아직 틀린 문제가 없어요. 잘하고 있어요!') + '</p>';
    var reviewBtn = el("button", "primary", "복습 시작 →");
    reviewBtn.disabled = wrongN === 0;
    reviewBtn.addEventListener("click", function(){ state.view = { name: "review", topicId: topicId }; render(); });
    cta.appendChild(reviewBtn);
    wrap.appendChild(cta);

    app.appendChild(wrap);
  }

  /* ---------- review: list + jump into a single drill ---------- */
  function renderReview(topicId) {
    var topic = getTopic(topicId);
    var wrap = el("div", "exercise-shell");
    var bar = el("div", "backline");
    var b = backBtn("허브로");
    b.addEventListener("click", function(){ state.view = { name: "hub", topicId: topicId }; render(); });
    bar.appendChild(b);
    wrap.appendChild(bar);

    var head = el("div", "hub-head");
    head.innerHTML = '<p class="eyebrow">Review</p><h2>오답 노트</h2><p>틀렸던 문제만 다시 풀어보세요. 다시 정답을 맞히면 홈 화면의 표시도 함께 바뀝니다.</p>';
    wrap.appendChild(head);

    var items = wrongItems(topicId);
    if (!items.length) {
      wrap.appendChild(el("p", "empty-note", "틀린 문제가 없습니다. 허브로 돌아가서 다음 회차를 진행해 보세요."));
    } else {
      items.forEach(function(it){
        var row = el("button", "review-row");
        row.type = "button";
        row.innerHTML =
          '<span class="rtag mono">' + (it.roundIdx+1) + '회차</span>' +
          '<span class="rlabel">' + DRILL_LABELS[it.key] + '</span>';
        row.addEventListener("click", function(){
          state.view = { name: it.key, topicId: topicId, roundIdx: it.roundIdx, review: true };
          render();
        });
        wrap.appendChild(row);
      });
    }
    app.appendChild(wrap);
  }

  /* ---------- grammar ---------- */
  function renderGrammar(topicId) {
    var topic = getTopic(topicId);
    var shell = el("div", "exercise-shell");
    var bar = el("div", "backline");
    var b = backBtn("허브로");
    b.addEventListener("click", function(){ state.view = { name: "hub", topicId: topicId }; render(); });
    bar.appendChild(b);
    shell.appendChild(bar);

    var card = el("div", "card");
    card.innerHTML = '<p class="eyebrow">Grammar &middot; ' + topic.grammarLabel + '</p><h2>' + topic.title + '</h2><p class="sub">이 지문 속 문장을 하나씩 짚어가며 문법을 확인합니다. 확인한 뒤 허브에서 원하는 회차를 골라 연습하세요.</p>';
    if (topic.background || topic.structure) {
      var bgWrap = el("div", "bg-panel");
      var bgHtml = "";
      if (topic.background) {
        bgHtml += '<div class="bg-block"><p class="bg-label">배경 지식</p><p class="bg-text">' + topic.background + '</p></div>';
      }
      if (topic.structure) {
        bgHtml += '<div class="bg-block"><p class="bg-label">내용 전개</p><p class="bg-text">' + topic.structure + '</p></div>';
      }
      bgWrap.innerHTML = bgHtml;
      card.appendChild(bgWrap);
    }
    topic.grammar.forEach(function(chunk){
      var c = el("div", "grammar-chunk");
      var body = '<h4>' + chunk.h + '</h4>';
      chunk.body.forEach(function(p){ body += '<p>' + p + '</p>'; });
      chunk.ex.forEach(function(parts){
        body += '<div class="ex-box">' + parts[0] + ' <span class="rel">' + parts[1] + '</span> ' + parts[2] + '</div>';
      });
      if (chunk.chunks && chunk.chunks.length) {
        body += '<p class="chunk-label">문장 끊어 읽기 · Chunking</p><div class="chunk-block">';
        chunk.chunks.forEach(function(pair){
          body += '<div class="chunk-row"><span class="chunk-en">' + pair[0] + '</span><span class="chunk-kr">' + pair[1] + '</span></div>';
        });
        body += '</div>';
      }
      c.innerHTML = body;
      card.appendChild(c);
    });
    var actions = el("div", "actions");
    var next = el("button", "primary", "허브로 이동 →");
    next.addEventListener("click", function(){
      if (!topicProgress(topic.id).grammarRead) markGrammarRead(topic.id);
      state.view = { name: "hub", topicId: topic.id };
      render();
    });
    actions.appendChild(next);
    card.appendChild(actions);
    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ---------- shared drill chrome ---------- */
  function drillProgressTrack(topicId, roundIdx, activeKey) {
    var track = el("div", "progress-track");
    var rp = roundProgress(topicId, roundIdx);
    DRILL_KEYS.forEach(function(k){
      var seg = el("span", "progress-seg");
      var done = rp[k] && rp[k].done;
      if (done) seg.className += " done";
      if (k === activeKey) seg.className += " active";
      track.appendChild(seg);
    });
    return track;
  }
  function drillTopBar(v, activeKey) {
    var bar = el("div", "backline");
    var b = backBtn(v.review ? "복습 목록으로" : "허브로");
    b.addEventListener("click", function(){
      state.view = v.review ? { name: "review", topicId: v.topicId } : { name: "hub", topicId: v.topicId };
      render();
    });
    bar.appendChild(b);
    bar.appendChild(drillProgressTrack(v.topicId, v.roundIdx, activeKey));
    return bar;
  }
  function nextViewFor(v, key) {
    if (v.review) return { name: "review", topicId: v.topicId };
    var nk = DRILL_NEXT[key];
    return { name: nk, topicId: v.topicId, roundIdx: v.roundIdx };
  }
  function nextLabelFor(nextView) {
    if (nextView.name === "review") return "복습 목록으로 →";
    if (nextView.name === "results") return "회차 결과 보기 →";
    return "다음 문제 →";
  }
  var AUTO_ADVANCE_SECONDS = 8;
  // Timers from auto-advance countdowns that are still running when a new
  // screen is rendered (e.g. the student tapped "next" manually before the
  // countdown finished on a screen that got replaced some other way) are
  // tracked here so render() can sweep them up instead of letting them run
  // on forever against detached DOM.
  var pendingAutoAdvanceTimers = [];
  function clearPendingAutoAdvanceTimers() {
    pendingAutoAdvanceTimers.forEach(function(t){ clearInterval(t); });
    pendingAutoAdvanceTimers = [];
  }
  function renderContinue(actionsEl, nextView) {
    if (actionsEl.dataset.continued === "1") return;
    actionsEl.dataset.continued = "1";
    var baseLabel = nextLabelFor(nextView);
    // Reuse the existing check/answer button by morphing it in place, rather
    // than appending a second button — guarantees exactly one, always
    // visible, always-clickable control.
    var existing = actionsEl.querySelector("button");
    var btn;
    if (existing) {
      btn = existing.cloneNode(false); // drop old listeners cleanly
      existing.parentNode.replaceChild(btn, existing);
    } else {
      btn = el("button", "");
      actionsEl.appendChild(btn);
    }
    btn.className = "primary continue-btn";
    btn.disabled = false;

    // Auto-advance after a short countdown so students aren't stuck waiting
    // on a button they might miss — but a click always jumps immediately,
    // and the countdown gives enough time to read the explanation first.
    //
    // Driven by a wall-clock deadline (not a decrementing counter) so a
    // throttled/delayed tick still lands on the right remaining time instead
    // of drifting, and re-checked on visibilitychange/focus so a phone that
    // was locked or a tab that was backgrounded (both of which browsers can
    // pause timers for) catches up the instant the student comes back,
    // rather than possibly leaving the countdown stuck.
    var deadline = Date.now() + AUTO_ADVANCE_SECONDS * 1000;
    var done = false;
    function label() {
      var remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      return baseLabel + " · " + remaining + "s";
    }
    btn.textContent = label();
    function go() {
      if (done) return;
      done = true;
      clearInterval(tickId);
      document.removeEventListener("visibilitychange", tick);
      window.removeEventListener("focus", tick);
      window.removeEventListener("pageshow", tick);
      var idx = pendingAutoAdvanceTimers.indexOf(tickId);
      if (idx !== -1) pendingAutoAdvanceTimers.splice(idx, 1);
      state.view = nextView;
      render();
    }
    function tick() {
      if (done) return;
      if (Date.now() >= deadline) { go(); } else { btn.textContent = label(); }
    }
    var tickId = setInterval(tick, 250);
    pendingAutoAdvanceTimers.push(tickId);
    document.addEventListener("visibilitychange", tick);
    window.addEventListener("focus", tick);
    window.addEventListener("pageshow", tick);
    btn.addEventListener("click", go);

    setTimeout(function(){
      btn.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 60);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function roundEyebrow(v, n) {
    return (v.roundIdx+1) + "회차 · Drill " + n + " of 4 · " + DRILL_EYEBROW[["order","insertion","title","vocab"][n-1]];
  }

  /* ---------- drill 1: paragraph order ---------- */
  function renderOrder(v) {
    var topic = getTopic(v.topicId);
    var data = topic.rounds[v.roundIdx].passageOrder;
    var shell = el("div", "exercise-shell");
    shell.appendChild(drillTopBar(v, "order"));
    var card = el("div", "card");
    card.innerHTML =
      '<p class="eyebrow">' + roundEyebrow(v,1) + '</p><h2>Put the paragraphs in order</h2>' +
      '<p class="sub">' + data.q + '</p>';

    var given = el("div", "given-block");
    given.innerHTML = '<p class="given-tag">GIVEN</p><p class="serif">' + data.given + '</p>';
    card.appendChild(given);

    // 라벨(A/B/C)을 문단에 매번 무작위로 새로 배정합니다 — 본문 내용은 항상 동일하지만
    // 정답 순서(예: A→B→C, B→C→A ...)는 들어갈 때마다 달라집니다.
    var labels = shuffle(["A","B","C"]);
    var pieces = {};
    data.logicalPieces.forEach(function(text, idx){ pieces[labels[idx]] = text; });
    var correctOrder = labels.slice();

    var keys = Object.keys(pieces);
    var shuffled = shuffle(keys.slice());
    while (JSON.stringify(shuffled) === JSON.stringify(correctOrder)) shuffled = shuffle(keys.slice());

    var pile = el("div", "para-pile");
    pile.appendChild(el("p", "drag-hint", "문단을 순서대로 클릭하면 아래 슬롯에 차례로 배치됩니다. 슬롯을 클릭하면 다시 뺄 수 있어요."));
    var answer = [];

    var slotsWrap = el("div", "order-slots");
    var slots = [];
    for (var i=0; i<keys.length; i++) {
      var s = el("div", "order-slot", String(i+1));
      slots.push(s);
      slotsWrap.appendChild(s);
    }

    function renderSlots() {
      slots.forEach(function(s, idx){
        s.style.borderColor = "";
        s.style.borderStyle = "";
        var k = answer[idx];
        if (k) {
          s.classList.add("filled");
          s.innerHTML = '<span class="letter">' + k + '</span>';
        } else {
          s.classList.remove("filled");
          s.textContent = String(idx+1);
        }
      });
    }
    function renderPile() {
      pile.querySelectorAll(".para-card").forEach(function(c){
        var k = c.dataset.key;
        c.classList.toggle("used", answer.indexOf(k) !== -1);
      });
    }

    var feedback = el("div", "feedback");
    var actions = el("div", "actions");
    var check = el("button", "primary", "Check order");
    var checked = false;
    function doCheck() {
      if (checked) return;
      if (answer.length !== keys.length) {
        feedback.className = "feedback bad show";
        feedback.innerHTML = "<strong>아직 다 채우지 않았어요</strong>" + keys.length + "개의 문단을 모두 슬롯에 넣은 후 확인해 주세요.";
        return;
      }
      checked = true;
      var correct = JSON.stringify(answer) === JSON.stringify(correctOrder);
      slots.forEach(function(s, idx){
        s.style.borderColor = answer[idx] === correctOrder[idx] ? "var(--accent)" : "var(--warn)";
        s.style.borderStyle = "solid";
      });
      feedback.className = "feedback show " + (correct ? "good" : "bad");
      feedback.innerHTML = correct
        ? "<strong>Correct</strong>" + correctOrder.join(" → ") + " — " + data.explainGood
        : "<strong>Not quite</strong>Correct order: " + correctOrder.join(" → ") + ". " + data.explainBad;
      markDone(v.topicId, v.roundIdx, "order", { correct: correct });
      renderContinue(actions, nextViewFor(v, "order"));
    }
    check.addEventListener("click", doCheck);

    // Filling the last slot submits automatically — no separate click needed —
    // but the button stays as a fallback in case something needs re-triggering.
    shuffled.forEach(function(k){
      var c = el("div", "para-card");
      c.dataset.key = k;
      c.innerHTML = '<span class="letter">' + k + '</span>' + pieces[k];
      c.addEventListener("click", function(){
        if (checked) return;
        if (answer.indexOf(k) !== -1) return;
        if (answer.length >= keys.length) return;
        answer.push(k);
        renderSlots();
        renderPile();
        if (answer.length === keys.length) doCheck();
      });
      pile.appendChild(c);
    });
    card.appendChild(pile);

    slots.forEach(function(slot, idx){
      slot.addEventListener("click", function(){
        if (checked) return;
        if (!answer[idx]) return;
        answer.splice(idx, 1);
        renderSlots();
        renderPile();
      });
    });
    card.appendChild(slotsWrap);
    renderSlots();

    card.appendChild(feedback);
    actions.appendChild(check);
    card.appendChild(actions);

    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ---------- drill 2: sentence insertion ---------- */
  function renderInsertion(v) {
    var topic = getTopic(v.topicId);
    var data = topic.rounds[v.roundIdx].insertion;
    var shell = el("div", "exercise-shell");
    shell.appendChild(drillTopBar(v, "insertion"));
    var card = el("div", "card");
    card.innerHTML =
      '<p class="eyebrow">' + roundEyebrow(v,2) + '</p><h2>Find where the sentence belongs</h2>' +
      '<p class="sub">' + data.q + '</p>';

    var given = el("div", "given-block");
    given.innerHTML = '<p class="given-tag">SENTENCE TO INSERT</p><p class="serif given-sentence">' + data.given + '</p>';
    card.appendChild(given);

    var passageEl = el("div", "passage");
    var text = data.paragraph;
    var parts = text.split(/\[(\d)\]/);
    var html = "";
    var selected = null;
    for (var i = 0; i < parts.length; i++) {
      if (/^\d$/.test(parts[i])) {
        html += '<span class="insert-marker mono" data-n="' + parts[i] + '">' + parts[i] + '</span>';
      } else {
        html += parts[i];
      }
    }
    passageEl.innerHTML = '<p>' + html + '</p>';
    card.appendChild(passageEl);

    var feedback = el("div", "feedback");
    var actions = el("div", "actions");
    var checked = false;

    // Clicking a marker submits it immediately (same one-tap pattern as the
    // title-match drill) — no separate "Check answer" click required.
    passageEl.querySelectorAll(".insert-marker").forEach(function(m){
      m.addEventListener("click", function(){
        if (checked) return;
        checked = true;
        passageEl.querySelectorAll(".insert-marker").forEach(function(o){ o.classList.remove("selected"); });
        m.classList.add("selected");
        selected = parseInt(m.dataset.n, 10);
        var correct = selected === data.correct;
        passageEl.querySelectorAll(".insert-marker").forEach(function(mm){
          if (parseInt(mm.dataset.n,10) === data.correct) { mm.style.background = "var(--accent)"; mm.style.borderColor="var(--accent)"; mm.style.color="#fff"; }
        });
        feedback.className = "feedback show " + (correct ? "good" : "bad");
        feedback.innerHTML = correct
          ? "<strong>Correct</strong>" + data.explainGood
          : "<strong>Not quite</strong>" + data.explainBad;
        markDone(v.topicId, v.roundIdx, "insertion", { correct: correct });
        renderContinue(actions, nextViewFor(v, "insertion"));
      });
    });
    card.appendChild(feedback);
    card.appendChild(actions);

    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ---------- drill 3: title matching ---------- */
  function renderTitle(v) {
    var topic = getTopic(v.topicId);
    var data = topic.rounds[v.roundIdx].titleMatch;
    var shell = el("div", "exercise-shell");
    shell.appendChild(drillTopBar(v, "title"));
    var card = el("div", "card");
    card.innerHTML =
      '<p class="eyebrow">' + roundEyebrow(v,3) + '</p><h2>Choose the best title</h2>' +
      '<p class="sub">' + data.q + '</p>';

    var passageEl = el("div", "passage");
    passageEl.innerHTML = "<p>" + data.passage + "</p>";
    card.appendChild(passageEl);

    var list = el("div", "choice-list");
    var chosen = null;
    var letters = ["A","B","C","D"];
    var feedback = el("div", "feedback");
    var actions = el("div", "actions");
    data.options.forEach(function(opt, idx){
      var c = el("div", "choice");
      c.innerHTML = '<span class="bub"></span><span class="txt"><span class="mono" style="color:var(--ink-faint);margin-right:6px;">' + letters[idx] + '</span>' + opt.t + '</span>';
      c.addEventListener("click", function(){
        if (chosen !== null) return;
        chosen = idx;
        data.options.forEach(function(o2, i2){
          var node = list.children[i2];
          if (o2.correct) node.classList.add("correct");
          else if (i2 === idx) node.classList.add("incorrect");
        });
        var correct = data.options[idx].correct;
        feedback.className = "feedback show " + (correct ? "good" : "bad");
        var correctOpt = data.options.filter(function(o){return o.correct;})[0];
        feedback.innerHTML = "<strong>" + (correct ? "Correct" : "Not quite") + "</strong>" +
          (correct ? correctOpt.note : opt.note + " Correct answer: “" + correctOpt.t + "” — " + correctOpt.note);
        markDone(v.topicId, v.roundIdx, "title", { correct: correct });
        renderContinue(actions, nextViewFor(v, "title"));
      });
      list.appendChild(c);
    });
    card.appendChild(list);
    card.appendChild(feedback);
    card.appendChild(actions);

    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ---------- drill 4: vocabulary usage ---------- */
  function renderVocab(v) {
    var topic = getTopic(v.topicId);
    var data = topic.rounds[v.roundIdx].vocab;
    var shell = el("div", "exercise-shell");
    shell.appendChild(drillTopBar(v, "vocab"));
    var card = el("div", "card");
    card.innerHTML =
      '<p class="eyebrow">' + roundEyebrow(v,4) + '</p><h2>Spot the words used incorrectly</h2>' +
      '<p class="sub">' + data.q + ' ' + data.note + '</p>';

    var CIRCLED = ["①","②","③","④","⑤","⑥","⑦","⑧"];
    var candByIndex = {};
    data.candidates.forEach(function(c){ candByIndex[c.i] = c; });
    var wrongSet = data.candidates.filter(function(c){ return !c.correct; }).map(function(c){ return c.i; });

    var passageEl = el("div", "passage");
    var picked = [];
    var p = document.createElement("p");
    data.tokens.forEach(function(tok, i){
      var cand = candByIndex[i];
      if (cand) {
        var span = document.createElement("span");
        span.className = "word-token";
        span.dataset.i = i;
        span.innerHTML = '<sup class="mono" style="color:var(--accent);font-weight:600;">' + CIRCLED[cand.n] + '</sup>' + tok;
        p.appendChild(span);
        span.addEventListener("click", function(){
          if (checked) return;
          var idx = picked.indexOf(i);
          if (idx === -1) { picked.push(i); span.classList.add("picked"); }
          else { picked.splice(idx,1); span.classList.remove("picked"); }
          count.textContent = picked.length + "개 선택됨";
          check.disabled = picked.length === 0;
        });
      } else {
        p.appendChild(document.createTextNode(tok));
      }
      p.appendChild(document.createTextNode(" "));
    });
    passageEl.appendChild(p);
    card.appendChild(passageEl);

    var count = el("div", "helper-count", "0개 선택됨");
    card.appendChild(count);

    var feedback = el("div", "feedback");
    var actions = el("div", "actions");
    var check = el("button", "primary", "Check selections");
    check.disabled = true;
    var checked = false;

    check.addEventListener("click", function(){
      checked = true;
      var correctPicks = 0, falsePicks = 0;
      picked.forEach(function(i){
        var span = passageEl.querySelector('[data-i="'+i+'"]');
        if (wrongSet.indexOf(i) !== -1) { span.classList.add("correct-mark"); correctPicks++; }
        else { span.classList.add("picked"); falsePicks++; }
      });
      wrongSet.forEach(function(i){
        if (picked.indexOf(i) === -1) {
          var span = passageEl.querySelector('[data-i="'+i+'"]');
          span.classList.add("missed-mark");
        }
      });
      var allCorrect = correctPicks === wrongSet.length && falsePicks === 0;
      feedback.className = "feedback show " + (allCorrect ? "good" : "bad");
      var explainHtml = wrongSet.map(function(i){
        var info = candByIndex[i];
        return "<div style='margin-top:6px;'>" + CIRCLED[info.n] + " <span class='mono' style='color:var(--warn);'>" + info.shown + "</span> → should read like <em>" + info.correctWord + "</em>. " + info.note + "</div>";
      }).join("");
      feedback.innerHTML = "<strong>" + (allCorrect ? "All correct" : "Answer key") + "</strong>" + explainHtml;
      markDone(v.topicId, v.roundIdx, "vocab", { correct: allCorrect });
      renderContinue(actions, nextViewFor(v, "vocab"));
    });
    actions.appendChild(check);
    card.appendChild(feedback);
    card.appendChild(actions);

    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ---------- round results ---------- */
  function renderResults(v) {
    var topic = getTopic(v.topicId);
    var rp = roundProgress(v.topicId, v.roundIdx);
    var shell = el("div", "exercise-shell");
    var bar = el("div", "backline");
    var b = backBtn("허브로");
    b.addEventListener("click", function(){ state.view = { name: "hub", topicId: v.topicId }; render(); });
    bar.appendChild(b);
    shell.appendChild(bar);

    var card = el("div", "card");
    card.innerHTML = '<p class="eyebrow">' + (v.roundIdx+1) + '회차 완료</p><h2>' + topic.title + ' — ' + (v.roundIdx+1) + '회차 결과</h2><p class="sub">아래는 이번 회차의 드릴별 결과입니다. 틀린 문제는 허브에서 "오답만 모아 복습하기"로 다시 풀 수 있어요.</p>';

    var grid = el("div", "results-grid");
    DRILL_KEYS.forEach(function(k){
      var r = rp[k];
      var tile = el("div", "result-tile " + (r ? (r.correct ? "ok" : "miss") : ""));
      tile.innerHTML = '<div class="n">' + (r ? (r.correct ? "✓" : "✗") : "—") + '</div><div class="l">' + DRILL_LABELS[k] + '</div>';
      grid.appendChild(tile);
    });
    card.appendChild(grid);

    var actions = el("div", "actions");
    var hubBtn = el("button", "ghost", "허브로 돌아가기");
    hubBtn.addEventListener("click", function(){ state.view = { name: "hub", topicId: v.topicId }; render(); });
    actions.appendChild(hubBtn);
    if (v.roundIdx + 1 < topic.rounds.length) {
      var nextRoundBtn = el("button", "primary", (v.roundIdx+2) + "회차 시작 →");
      nextRoundBtn.addEventListener("click", function(){
        state.view = { name: "order", topicId: v.topicId, roundIdx: v.roundIdx + 1 };
        render();
      });
      actions.appendChild(nextRoundBtn);
    }
    card.appendChild(actions);

    shell.appendChild(card);
    app.appendChild(shell);
  }

  /* ============================================================
     BOOT
     ============================================================ */
  document.getElementById("studentChip").addEventListener("click", function(){
    if (!state.studentId) return;
    document.getElementById("switchPopName").textContent = state.studentName;
    document.getElementById("switchPop").hidden = false;
  });
  document.getElementById("switchCancel").addEventListener("click", function(){
    document.getElementById("switchPop").hidden = true;
  });
  document.getElementById("switchConfirm").addEventListener("click", function(){
    document.getElementById("switchPop").hidden = true;
    state.studentId = null; state.studentName = null; state.studentGrade = null; state.progress = {};
    try { localStorage.removeItem("bubblesheet_student"); } catch(e) {}
    state.view = { name: "home" };
    render();
  });
  document.addEventListener("click", function(e){
    var pop = document.getElementById("switchPop");
    if (!pop.hidden && !pop.contains(e.target) && e.target.id !== "studentChip" && !e.target.closest("#studentChip")) {
      pop.hidden = true;
    }
  });

  function boot(saved) {
    var existing = saved || loadLocal();
    if (existing && existing.id) {
      state.studentId = existing.id;
      state.studentName = existing.name;
      state.studentGrade = existing.grade || null;
    }
    initDb().then(function(){
      if (state.studentId) {
        loadProgress().then(render);
      } else {
        render();
      }
    });
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.ready ? window.claude.hot.ready(function(data){ boot(data && data.saved); }) : boot();
    if (window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function(){ return { saved: { id: state.studentId, name: state.studentName, grade: state.studentGrade } }; });
    }
  } else {
    boot();
  }
})();
</script>
